# =====================================================================
# WildMilu · Configuración del panel (Decap CMS)
# ---------------------------------------------------------------------
# ⚠️ NOTA IMPORTANTE (esto causó el error "Missing external media library"):
#    NO poner un bloque "media_library:" en la raíz de este archivo.
#    Ese bloque es SOLO para librerías externas (Cloudinary, Uploadcare).
#    El límite de tamaño va DENTRO del campo de imagen (ver más abajo).
# =====================================================================

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Agregar foto "{{slug}}"'
    update: 'Actualizar galería'
    delete: 'Eliminar foto "{{slug}}"'
    uploadMedia: 'Subir imagen "{{path}}"'
    deleteMedia: 'Eliminar imagen "{{path}}"'

locale: es

# URL del sitio publicado (botón "Ver sitio" en el panel)
site_url: https://wildmilu.netlify.app
display_url: https://wildmilu.netlify.app

# Dónde se guardan las imágenes que sube Milagros
media_folder: "images"       # carpeta real dentro del repo
public_folder: "/images"     # ruta con la que se ven en la web

collections:
  - name: galeria
    label: "Galería de WildMilu"
    delete: false
    files:
      - name: fotos
        label: "📷 Todas las fotos"
        file: "fotos.json"
        format: json
        description: >
          Acá agregás, editás o eliminás fotos. Tocá "Fotos" para ver la lista,
          usá el botón de abajo para agregar una nueva y arrastrá para reordenar.
        fields:
          - name: fotos
            label: "Fotos"
            label_singular: "Foto"
            widget: list
            summary: "{{fields.titulo}}  ·  {{fields.categoria}}"
            fields:
              # 👇 El límite de tamaño va ACÁ, dentro del campo de imagen
              - name: src
                label: "Imagen"
                widget: image
                hint: "Arrastrá o elegí la foto. Ideal horizontal y liviana."
                media_library:
                  config:
                    max_file_size: 10485760   # 10 MB (en bytes)

              - { name: titulo, label: "Título", widget: string }
              - { name: especie, label: "Especie (nombre científico o común)", widget: string, required: false }
              - name: categoria
                label: "Categoría (hábitat)"
                widget: select
                default: "Otra fauna"
                options:
                  - "Jardín"
                  - "Bosque"
                  - "Humedales"
                  - "Rapaces"
                  - "Pastizal"
                  - "Otra fauna"
              - { name: lugar, label: "Lugar donde la sacaste", widget: string, required: false }
              - { name: fecha, label: "Fecha (ej: Enero 2026)", widget: string, required: false }
              - { name: descripcion, label: "Descripción / anécdota", widget: text, required: false }
